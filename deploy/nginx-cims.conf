# Nginx site for CIMS. server-setup.sh copies this to
# /etc/nginx/sites-available/cims with __DOMAIN__ replaced; certbot then adds
# the HTTPS (443) server and the redirect from http.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/cims/public;
    index index.php;
    charset utf-8;

    # Product photos and Excel imports.
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The installable-app files must never be cached stale.
    location = /pos-sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # .env, .git and the like.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
